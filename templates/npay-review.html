<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="referrer" content="no-referrer">
    <title>네이버페이 연동 검수 — Himawari</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
    <link rel="stylesheet" href="/assets/npay-review.css">
  </head>
  <body data-npay-review-token="">
    <header class="npay-review-header">
      <img src="/assets/himawari-logo-hq.png" alt="Himawari">
      <div>
        <p>HIMAWARI KOREA · NAVER PAY REVIEW</p>
        <h1>네이버페이 주문형<br>테스트 상품 검수</h1>
        <p>연동 버전 v2.1 · Sandbox 환경 · 전체 <strong data-review-product-count>0</strong>개 상품</p>
      </div>
    </header>

    <main>
      <aside class="npay-review-notice" aria-label="검수 안내">
        <strong>검수 전용 비공개 페이지입니다.</strong>
        <span>아래 모든 버튼은 네이버페이 Sandbox 환경으로 연결됩니다. 운영 쇼핑몰에는 승인 전까지 네이버페이 버튼이 표시되지 않습니다.</span>
      </aside>

      <section class="npay-review-cart" aria-labelledby="npay-review-cart-title">
        <div>
          <p>TEST CART</p>
          <h2 id="npay-review-cart-title">장바구니 주문 테스트</h2>
          <div data-review-cart-summary>상품 카드에서 ‘검수 장바구니 담기’를 눌러 주세요.</div>
        </div>
        <section data-npay-cart-section aria-label="네이버페이 장바구니 주문" hidden>
          <div id="npay-review-cart-button" data-npay-cart></div>
          <p class="npay-status" data-npay-status role="status" aria-live="polite"></p>
        </section>
      </section>

      <section class="npay-review-products" aria-label="전체 검수 상품">
        <!-- SERVER_REVIEW_PRODUCTS -->
      </section>
    </main>

    <footer>
      <strong>히마와리 코리아</strong>
      <span>사업자번호 462-66-00596 · 대표 남영선 · golf4484@naver.com</span>
    </footer>
    <script type="module" src="/assets/npay-review.js"></script>
  </body>
</html>
