    <main id="main-content" class="guest-order-main">
      <header class="page-intro"><div><p class="kicker">Guest order</p><h1>비회원 주문을<br><span class="accent-word">확인합니다.</span></h1></div><p>주문 접수 시 사용한 주문번호·이메일·전화번호가 모두 일치해야 조회할 수 있습니다.</p></header>
      <div class="guest-order-grid">

          <div class="order-field"><label for="guest-order-phone">주문 연락처</label><input id="guest-order-phone" name="phone" type="tel" maxlength="24" autocomplete="tel" placeholder="010-0000-0000" required></div>
          <p class="order-field-error" data-guest-error role="alert"></p><button class="order-primary-link" type="submit">주문 조회 <span aria-hidden="true">→</span></button>
        </form>
        <section class="checkout-section guest-order-result" data-guest-result aria-live="polite"><div class="checkout-section__head"><p class="kicker">Order status</p><h2>조회 결과</h2></div><p>왼쪽에 주문 정보를 입력해 주세요.</p></section>
