<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta name="theme-color" content="#4F6B58" />
    <title>리뷰·재입고 관리 — Himawari</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="stylesheet" href="admin.css" />
    <script src="review-admin.js" type="module"></script>
  </head>
  <body>
    <a class="skip-link" href="#admin-main">본문으로 바로가기</a>
    <header class="admin-header admin-header--console">
      <a class="admin-brand" href="../index.html">HIMAWARI</a>
      <nav class="admin-nav" aria-label="관리자 메뉴"><a href="operations.html">운영 현황</a>
        <a href="inquiries.html">문의 관리</a
        ><a href="products.html">제품 관리</a><a href="orders.html">주문 관리</a
        ><a href="reviews.html" aria-current="page">리뷰·재입고</a
        ><a href="promotions.html">프로모션</a><a href="reels.html">영상 관리</a>
      </nav>
      <a class="admin-header__site" href="../products.html"
        >공개 제품 보기 ↗</a
      >
    </header>
    <main id="admin-main" class="admin-main">
      <section class="initial-state" data-initial-view>
        <span class="loader" aria-hidden="true"></span>
        <p>리뷰 정보를 확인하고 있습니다.</p>
      </section>
      <section class="login-view" data-login-view hidden>
        <div class="login-copy">
          <p class="eyebrow">Administrator only</p>
          <h1>리뷰·재입고 관리</h1>
          <p>구매 확인 리뷰를 검수하고 재입고 신청 수요를 확인합니다.</p>
        </div>
        <form class="login-form" data-login-form novalidate>
          <div class="form-field">
            <label for="admin-password">관리자 비밀번호</label>
            <div class="secret-control">
              <input id="admin-password" type="password" required /><button
                type="button"
                data-password-toggle
              >
                표시
              </button>
            </div>
            <p class="field-error" id="admin-password-error"></p>
          </div>
          <button class="button button--primary" type="submit">
            관리자 로그인 →
          </button>
          <p class="form-status" data-login-status></p>
        </form>
      </section>
      <section class="board-view" data-board-view hidden>
        <div class="board-head">
          <div>
            <p class="eyebrow">Customer proof</p>
            <h1 tabindex="-1" data-board-title>리뷰·재입고 관리</h1>
            <p>공개 전 내용을 확인하고, 상품별 재입고 신청 수를 살펴보세요.</p>
          </div>
          <button class="button button--quiet" data-logout>로그아웃</button>
        </div>
        <div class="review-admin-toolbar">
          <label
            >리뷰 상태<select data-review-filter>
              <option value="">전체</option>
              <option value="pending">공개 대기</option>
              <option value="published">공개 중</option>
              <option value="rejected">비공개</option>
            </select></label
          ><button class="button button--quiet" data-refresh>새로고침</button>
        </div>
        <p
          class="board-status"
          data-board-status
          role="status"
          aria-live="polite"
        ></p>
        <div class="review-admin-layout">
          <section>
            <h2>구매 확인 리뷰</h2>
            <div class="review-admin-list" data-review-list></div>
          </section>
          <section>
            <h2>재입고 신청 현황</h2>
            <div class="restock-admin-list" data-restock-list></div>
            <p class="field-help">
              재입고 알림 메일 자동 발송은 발송 도메인 연결 후 활성화됩니다.
              현재는 신청 수요를 안전하게 보관합니다.
            </p>
          </section>
        </div>
      </section>
    </main>
  </body>
</html>
