<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <title>회원 관리 — Himawari</title>
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="console-layout.css?v=20261008">
  <link rel="stylesheet" href="members.css">
  <script src="member-admin.js" type="module"></script>
</head>
<body>
  <a class="skip-link" href="#admin-main">본문으로 바로가기</a>
  <header class="admin-header admin-header--console">
    <div class="admin-identity"><a class="admin-brand" href="../index.html">HIMAWARI</a><span>관리자</span></div>
    <nav class="admin-nav" aria-label="관리자 메뉴"><a href="operations.html">운영 현황</a><a href="inquiries.html">문의 관리</a><a href="products.html">제품 관리</a><a href="orders.html">주문 관리</a><a href="members.html" aria-current="page">회원 관리</a><a href="reviews.html">리뷰·재입고</a><a href="promotions.html">프로모션</a><a href="reels.html">영상 관리</a></nav>
    <a class="admin-header__site" href="../index.html">첫 화면 보기 ↗</a>
  </header>
  <main class="admin-main" id="admin-main">
    <section class="initial-state" data-initial-view role="status"><span class="loader" aria-hidden="true"></span><p>관리자 세션을 확인하고 있습니다.</p></section>
    <section class="login-view" data-login-view hidden>
      <div class="login-copy"><p class="eyebrow">Administrator only</p><h1>회원 관리</h1><p>소유자 계정으로 로그인해 가입 회원을 확인하세요.</p></div>
      <form class="login-form" data-login-form>
        <div class="form-field"><label for="member-admin-password">관리자 비밀번호</label><div class="secret-control"><input id="member-admin-password" type="password" maxlength="256" autocomplete="current-password" required><button type="button" data-password-toggle aria-label="비밀번호 표시" aria-pressed="false">표시</button></div></div>
        <button class="button button--primary" type="submit">관리자 로그인 <span aria-hidden="true">→</span></button>
        <p class="form-status" data-login-status role="status"></p>
      </form>
    </section>
    <section class="board-view" data-board-view hidden>
      <div class="board-head"><div><p class="eyebrow">Members</p><h1>회원 관리</h1><p>가입일, 최근 로그인, 연결된 로그인 서비스를 확인할 수 있습니다.</p></div><button class="button button--quiet" type="button" data-logout>로그아웃</button></div>
      <form class="member-admin-filters" data-member-filters>
        <label class="admin-field"><span>이름 또는 이메일</span><input type="search" name="query" maxlength="120" placeholder="이름 또는 이메일로 검색"></label>
        <label class="admin-field"><span>계정 상태</span><select name="status"><option value="">전체</option><option value="active">사용 중</option><option value="disabled">사용 중지</option></select></label>
        <button class="button button--quiet" type="submit">검색</button>
      </form>
      <p class="board-status" data-member-status role="status"></p>
      <div class="member-admin-table" role="region" aria-label="가입 회원 목록" tabindex="0">
        <table><thead><tr><th scope="col">회원</th><th scope="col">로그인 서비스</th><th scope="col">가입일</th><th scope="col">최근 로그인</th><th scope="col">계정 상태</th><th scope="col">관리</th></tr></thead><tbody data-member-list></tbody></table>
      </div>
      <div class="member-admin-pages"><button class="button button--quiet" type="button" data-member-prev disabled>이전</button><button class="button button--quiet" type="button" data-member-next disabled>다음</button></div>
    </section>
  </main>
</body>
</html>
